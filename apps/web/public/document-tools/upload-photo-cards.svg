<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="card-shadow" x="10" y="10" width="100" height="100" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>
  <!-- Back Card (Layered & Tilted) -->
  <g transform="rotate(-12, 44, 56)">
    <rect x="18" y="20" width="64" height="64" rx="14" fill="#F0F6FF" stroke="#BFDBFE" stroke-width="1.8"/>
    <rect x="26" y="28" width="48" height="48" rx="10" fill="#E0EEFF" opacity="0.6"/>
  </g>
  <!-- Front Card with Photo Frame -->
  <g filter="url(#card-shadow)">
    <rect x="28" y="22" width="66" height="66" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.8"/>
    <rect x="38" y="32" width="46" height="46" rx="10" fill="#F8FAFC" stroke="#F1F5F9" stroke-width="1.2"/>
    <!-- Mountain and Sun Landscape Icon -->
    <circle cx="49" cy="42" r="3.8" fill="#94A3B8"/>
    <path d="M41 68L52 53C52.8 52 54.2 52 55 53L60 60L65 53.5C65.8 52.5 67.2 52.5 68 53.5L78 68" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M41 68L52 53C52.8 52 54.2 52 55 53L60 60L65 53.5C65.8 52.5 67.2 52.5 68 53.5L78 68H41Z" fill="#E2E8F0" fill-opacity="0.7"/>
  </g>
  <!-- Plus Action Badge -->
  <circle cx="88" cy="86" r="15" fill="#2563EB" stroke="#FFFFFF" stroke-width="3"/>
  <path d="M88 78V94M80 86H96" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
