<svg width="360" height="700" viewBox="0 0 360 700" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Saffron Gradient -->
    <linearGradient id="left-saffron-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9933" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#FF7700" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#FFAA44" stop-opacity="0.2" />
    </linearGradient>

    <!-- White / Center Gradient -->
    <linearGradient id="left-white-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#F8FAFC" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.1" />
    </linearGradient>

    <!-- Green Gradient -->
    <linearGradient id="left-green-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#128807" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#16A34A" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#22C55E" stop-opacity="0.15" />
    </linearGradient>

    <filter id="soft-glow-left" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g filter="url(#soft-glow-left)" opacity="0.85">
    <!-- Green lower ribbon band -->
    <path d="M-40 480C40 430 140 480 180 540C220 600 190 660 120 710C60 750 -20 730 -50 710Z" fill="url(#left-green-grad)" />
    <path d="M-60 380C30 330 110 390 140 460C170 530 140 600 70 650C20 680 -40 660 -70 640Z" fill="url(#left-white-grad)" opacity="0.6" />
    
    <!-- Sweeping tricolor banner wave across mid-left -->
    <path d="M-80 160C10 210 130 330 90 470C60 570 -10 610 -70 630L-90 560C-40 540 10 510 30 440C60 330 -30 250 -100 200Z" fill="url(#left-green-grad)" />
    <path d="M-90 120C15 170 145 295 110 440C85 530 15 580 -50 600L-70 540C-20 520 35 480 55 415C85 305 -15 215 -110 165Z" fill="url(#left-white-grad)" />
    <path d="M-100 80C20 130 160 260 130 410C105 500 40 550 -30 570L-50 510C-5 490 55 450 75 390C105 280 0 180 -120 130Z" fill="url(#left-saffron-grad)" />
  </g>
</svg>
