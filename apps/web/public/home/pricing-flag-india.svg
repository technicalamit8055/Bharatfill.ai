<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="circle-flag-clip">
      <circle cx="24" cy="24" r="22" />
    </clipPath>
    <filter id="flag-shadow" x="0" y="0" width="48" height="48" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.1" />
    </filter>
  </defs>

  <g filter="url(#flag-shadow)">
    <!-- Flag clipped to circle -->
    <g clip-path="url(#circle-flag-clip)">
      <!-- Saffron band -->
      <rect x="0" y="2" width="48" height="15" fill="#FF9933" />
      <!-- White band -->
      <rect x="0" y="17" width="48" height="14" fill="#FFFFFF" />
      <!-- Green band -->
      <rect x="0" y="31" width="48" height="15" fill="#138808" />

      <!-- Ashoka Chakra in center -->
      <circle cx="24" cy="24" r="5" stroke="#000080" stroke-width="1" fill="none" />
      <circle cx="24" cy="24" r="1.2" fill="#000080" />
      
      <!-- Chakra Spokes -->
      <g stroke="#000080" stroke-width="0.7">
        <line x1="24" y1="19" x2="24" y2="29" />
        <line x1="19" y1="24" x2="29" y2="24" />
        <line x1="20.46" y1="20.46" x2="27.54" y2="27.54" />
        <line x1="20.46" y1="27.54" x2="27.54" y2="20.46" />
        <line x1="22.26" y1="19.34" x2="25.74" y2="28.66" />
        <line x1="25.74" y1="19.34" x2="22.26" y2="28.66" />
        <line x1="19.34" y1="22.26" x2="28.66" y2="25.74" />
        <line x1="19.34" y1="25.74" x2="28.66" y2="22.26" />
      </g>
    </g>

    <!-- Subtle outer rim -->
    <circle cx="24" cy="24" r="22" stroke="#E2E8F0" stroke-width="1.5" />
  </g>
</svg>
