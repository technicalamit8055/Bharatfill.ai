<svg width="220" height="100" viewBox="0 0 220 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Soft floating drop shadow -->
    <filter id="bubble-shadow" x="0" y="0" width="220" height="100" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0066FF" flood-opacity="0.08" />
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.04" />
    </filter>

    <linearGradient id="bubble-border" x1="10" y1="10" x2="200" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>
  </defs>

  <g filter="url(#bubble-shadow)">
    <!-- Speech bubble body -->
    <path d="M26 12 C18 12 12 18 12 26 L12 60 C12 68 18 74 26 74 L130 74 L142 86 C144 88 148 88 150 86 L156 74 L194 74 C202 74 208 68 208 60 L208 26 C208 18 202 12 194 12 Z" 
          fill="#FFFFFF" stroke="url(#bubble-border)" stroke-width="1.5" />

    <!-- Text -->
    <text x="110" y="38" fill="#0F172A" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Have a question?</text>
    <text x="110" y="58" fill="#475569" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">We're here to help!</text>
  </g>
</svg>
