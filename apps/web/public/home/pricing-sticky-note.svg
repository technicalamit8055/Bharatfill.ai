<svg width="220" height="200" viewBox="0 0 220 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Realistic paper drop shadow -->
    <filter id="sticky-shadow" x="0" y="0" width="220" height="200" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="2" dy="8" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.12" />
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.08" />
    </filter>

    <!-- Warm sticky paper gradient -->
    <linearGradient id="sticky-bg" x1="20" y1="15" x2="190" y2="175" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="40%" stop-color="#FEF08A" />
      <stop offset="100%" stop-color="#FDE047" />
    </linearGradient>

    <!-- Paper curl corner shadow -->
    <linearGradient id="corner-curl" x1="180" y1="160" x2="195" y2="175" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EAB308" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#CA8A04" stop-opacity="0.6" />
    </linearGradient>
  </defs>

  <!-- Sticky Note Body (Tilted 5 degrees counter-clockwise) -->
  <g transform="rotate(-5 105 95)" filter="url(#sticky-shadow)">
    <!-- Sticky pad sheet -->
    <path d="M22 18 C22 15 25 12 28 12 L182 12 C185 12 188 15 188 18 L188 162 C188 165 185 178 174 178 L28 178 C25 178 22 175 22 172 Z" fill="url(#sticky-bg)" />
    
    <!-- Top sticky adhesive strip bar reflection -->
    <rect x="22" y="12" width="166" height="24" rx="2" fill="#FFFFFF" fill-opacity="0.25" />

    <!-- Handwritten Marker Text -->
    <g fill="#1E293B" font-family="'Caveat', 'Segoe Print', 'Comic Sans MS', cursive, sans-serif" font-weight="700" text-anchor="middle">
      <text x="105" y="70" font-size="25" letter-spacing="0.5" transform="rotate(-1.5 105 70)">Save Time</text>
      <text x="105" y="112" font-size="25" letter-spacing="0.5" transform="rotate(-0.5 105 112)">Serve More</text>
      <text x="105" y="154" font-size="25" letter-spacing="0.5" transform="rotate(1 105 154)">Go Digital</text>
    </g>

    <!-- Subtle pencil underline doodle -->
    <path d="M50 162 C70 160 120 161 160 163" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" opacity="0.6" />
  </g>
</svg>
