<svg width="360" height="700" viewBox="0 0 360 700" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Saffron Gradient -->
    <linearGradient id="right-saffron-grad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF9933" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#FF7700" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#FFAA44" stop-opacity="0.2" />
    </linearGradient>

    <!-- White / Center Gradient -->
    <linearGradient id="right-white-grad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#F8FAFC" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.1" />
    </linearGradient>

    <!-- Green Gradient -->
    <linearGradient id="right-green-grad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#128807" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#16A34A" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#22C55E" stop-opacity="0.15" />
    </linearGradient>

    <filter id="soft-glow-right" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g filter="url(#soft-glow-right)" opacity="0.85">
    <!-- Sweeping tricolor banner wave across mid-right -->
    <path d="M440 160C350 210 230 330 270 470C300 570 370 610 430 630L450 560C400 540 350 510 330 440C300 330 390 250 460 200Z" fill="url(#right-green-grad)" />
    <path d="M450 120C345 170 215 295 250 440C275 530 345 580 410 600L430 540C380 520 325 480 305 415C275 305 375 215 470 165Z" fill="url(#right-white-grad)" />
    <path d="M460 80C340 130 200 260 230 410C255 500 320 550 390 570L410 510C365 490 305 450 285 390C255 280 360 180 480 130Z" fill="url(#right-saffron-grad)" />
  </g>
</svg>
